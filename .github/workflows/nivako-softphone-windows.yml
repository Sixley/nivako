name: Build NIVAKO Softphone Windows

on:
  workflow_dispatch:
  push:
    branches:
      - nivako-softphone-windows-build
    paths:
      - ".github/workflows/nivako-softphone-windows.yml"
      - "tools/nivako-windows-softphone/**"

concurrency:
  group: nivako-softphone-windows
  cancel-in-progress: true

env:
  SOFTPHONE_DIR: tools/nivako-windows-softphone
  LINPHONE_SDK_URL: https://download.linphone.org/releases/windows/sdk/linphone-sdk-win64-5.4.124.zip

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SOFTPHONE_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOFTPHONE_DIR }}/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ${{ env.SOFTPHONE_DIR }}
        run: npm ci

      - name: Download Linphone Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "$env:LINPHONE_SDK_URL" -OutFile linphone-sdk.zip
          Expand-Archive -Path linphone-sdk.zip -DestinationPath linphone-sdk -Force
          $lib = Get-ChildItem -Path linphone-sdk -Recurse -Filter liblinphone.lib | Select-Object -First 1
          if (-not $lib) {
            Get-ChildItem -Path linphone-sdk -Recurse -Depth 3 | Select-Object FullName
            throw "liblinphone.lib was not found in the Linphone SDK archive"
          }
          "LINPHONE_SDK_DIR=$((Resolve-Path linphone-sdk).Path)" >> $env:GITHUB_ENV
          "LINPHONE_LIB_DIR=$((Split-Path $lib.FullName -Parent))" >> $env:GITHUB_ENV
          Write-Host "Using liblinphone from $($lib.FullName)"

      - name: Stage Linphone runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = "$env:SOFTPHONE_DIR\src-tauri\linphone-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Remove-Item -Path "$runtime\*.dll" -Force -ErrorAction SilentlyContinue
          $dlls = Get-ChildItem -Path linphone-sdk -Recurse -Filter *.dll
          if (-not $dlls) {
            throw "No Linphone runtime DLLs were found in the SDK archive"
          }
          $dlls | Copy-Item -Destination $runtime -Force
          if (-not (Test-Path "$runtime\liblinphone.dll")) {
            Get-ChildItem -Path $runtime | Select-Object Name
            throw "liblinphone.dll was not staged for the Windows runtime"
          }
          Write-Host "Staged $($dlls.Count) Linphone runtime DLLs in $runtime"

      - name: Test
        working-directory: ${{ env.SOFTPHONE_DIR }}
        run: npm test -- --run

      - name: Build frontend
        working-directory: ${{ env.SOFTPHONE_DIR }}
        run: npm run build

      - name: Build Tauri Windows app
        id: tauri_build
        continue-on-error: true
        working-directory: ${{ env.SOFTPHONE_DIR }}
        env:
          CARGO_BUILD_JOBS: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          npm run tauri -- build --verbose 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\artifacts\tauri-build.log"
          exit $LASTEXITCODE

      - name: Validate bundled runtime
        if: steps.tauri_build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "$env:SOFTPHONE_DIR\src-tauri\target\release"
          if (-not (Test-Path "$release\nivako-softphone.exe")) {
            throw "Release executable was not created"
          }
          if (-not (Test-Path "$release\liblinphone.dll")) {
            Copy-Item "$env:SOFTPHONE_DIR\src-tauri\linphone-runtime\*.dll" -Destination $release -Force
          }
          if (-not (Test-Path "$release\liblinphone.dll")) {
            throw "liblinphone.dll is missing next to the release executable"
          }
          $manifests = Get-ChildItem -Path $release -Recurse -Include installer.nsi,*.wxs -ErrorAction SilentlyContinue
          $manifestHit = $manifests | Where-Object { Select-String -Path $_.FullName -Pattern "liblinphone.dll" -Quiet } | Select-Object -First 1
          if (-not $manifestHit) {
            $manifests | Select-Object FullName
            throw "liblinphone.dll is missing from the generated installer manifests"
          }
          Write-Host "Installer manifest includes liblinphone.dll via $($manifestHit.FullName)"

      - name: Create portable artifact
        if: steps.tauri_build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = "artifacts\nivako-softphone-windows-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          $exe = Get-ChildItem -Path "$env:SOFTPHONE_DIR\src-tauri\target\release" -Recurse -Filter "nivako-softphone.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "nivako-softphone.exe was not found"
          }
          Copy-Item $exe.FullName $portable
          Get-ChildItem -Path "$env:SOFTPHONE_DIR\src-tauri\linphone-runtime" -Filter *.dll | Copy-Item -Destination $portable -Force
          if (-not (Test-Path "$portable\liblinphone.dll")) {
            throw "Portable package is missing liblinphone.dll"
          }
          Compress-Archive -Path "$portable\*" -DestinationPath "artifacts\nivako-softphone-windows-portable.zip" -Force

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nivako-softphone-windows
          if-no-files-found: warn
          path: |
            artifacts/tauri-build.log
            artifacts/nivako-softphone-windows-portable.zip
            ${{ env.SOFTPHONE_DIR }}/src-tauri/target/release/bundle/**/*.msi
            ${{ env.SOFTPHONE_DIR }}/src-tauri/target/release/bundle/**/*.exe

      - name: Fail if Tauri build failed
        if: steps.tauri_build.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = "artifacts\tauri-build.log"
          $tail = if (Test-Path $logPath) { (Get-Content $logPath -Tail 50) -join "`n" } else { "No tauri-build.log found" }
          $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Host "::error title=Tauri build failed::$escaped"
          exit 1
